; PlatformIO Project Configuration File

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
lib_deps =
    jgromes/RadioLib@^7.5.0
    avinabmalla/ESP32_BleSerial@^3.0.0

[env:heltec_wifi_lora_32_V4]
platform = espressif32
board = heltec_wifi_lora_32_V3 ; no newer model available yet
board_build.mcu = esp32s3
framework = arduino
build_flags = 
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
monitor_filters = send_on_enter
lib_deps =
    jgromes/RadioLib@^7.5.0
    avinabmalla/ESP32_BleSerial@^3.0.0

[env:heltec_mesh_node_t114_V20]
platform = nordicnrf52
board = nrf52840_dk_adafruit
board_build.mcu = nrf52840
board_build.output = uf2
framework = arduino
platform_packages =
  framework-arduinoadafruitnrf52
build_flags =
  -DRADIOLIB_TONE_UNSUPPORTED
  -DUSE_NRF52
monitor_speed = 115200
monitor_filters = send_on_enter
lib_deps =
    jgromes/RadioLib@^7.5.0

; EOF
